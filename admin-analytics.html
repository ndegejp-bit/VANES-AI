<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANES Admin Analytics</title><style>body{font-family:Arial,sans-serif;background:#06101c;color:#eef8ff;margin:0;padding:30px}main{max-width:1100px;margin:auto}.card{background:#0b1a2a;border:1px solid #1b5a7d;border-radius:16px;padding:20px;margin:15px 0}input,button{padding:11px;border-radius:9px;border:1px solid #285776}input{width:70%;background:#fff;color:#111}button{background:#12314a;color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:9px;border-bottom:1px solid #1b3345;text-align:left;vertical-align:top}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main><h1>VANES AI · Admin analytics</h1><p>Private developer dashboard. Use an ADMIN_ANALYTICS_TOKEN configured as a Cloudflare secret.</p><div class="card"><input id="token" type="password" placeholder="Admin analytics token"><button id="load">Load data</button></div><div id="out"></div></main><script>const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');document.getElementById('load').onclick=async()=>{const out=document.getElementById('out');out.textContent='Loading…';try{const r=await fetch('/api/admin/analytics',{headers:{Authorization:'Bearer '+document.getElementById('token').value}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');out.innerHTML='<div class="card"><h2>Learners</h2><p>Total registered learner identities seen: '+d.totals.users+'</p><table><thead><tr><th>Name</th><th>Level</th><th>Combination</th><th>First seen</th><th>Last activity</th></tr></thead><tbody>'+d.users.map(x=>'<tr><td><strong>'+esc(x.user_name||'Unnamed learner')+'</strong></td><td>'+esc(x.level||'—')+'</td><td>'+esc(x.combination||'—')+'</td><td>'+esc(x.first_seen_at)+'</td><td>'+esc(x.last_seen_at)+'</td></tr>').join('')+'</tbody></table></div><div class="card"><h2>Recent activity</h2><table><thead><tr><th>Time</th><th>User</th><th>Event</th><th>Data</th></tr></thead><tbody>'+d.recent.map(x=>'<tr><td>'+esc(x.created_at)+'</td><td><strong>'+esc(x.user_name||'Unnamed learner')+'</strong><br><small>'+esc(x.anonymous_id)+'</small></td><td>'+esc(x.event)+'</td><td><pre>'+esc(JSON.stringify(JSON.parse(x.payload||'{}'),null,2))+'</pre></td></tr>').join('')+'</tbody></table></div>}catch(e){out.innerHTML='<div class="card">'+e.message+'</div>'}};</script></body></html>
