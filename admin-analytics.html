<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANES Admin Analytics</title><style>body{font-family:Arial,sans-serif;background:#06101c;color:#eef8ff;margin:0;padding:30px}main{max-width:1100px;margin:auto}.card{background:#0b1a2a;border:1px solid #1b5a7d;border-radius:16px;padding:20px;margin:15px 0}input,button{padding:11px;border-radius:9px;border:1px solid #285776}input{width:70%;background:#fff;color:#111}button{background:#12314a;color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:9px;border-bottom:1px solid #1b3345;text-align:left;vertical-align:top}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main><h1>VANES AI · Admin analytics</h1><p>Private developer dashboard. Use an ADMIN_ANALYTICS_TOKEN configured as a Cloudflare secret.</p><div class="card"><input id="token" type="password" placeholder="Admin analytics token"><button id="load">Load data</button></div><div id="out"></div></main><script>document.getElementById('load').onclick=async()=>{const out=document.getElementById('out');out.textContent='Loading…';try{const r=await fetch('/api/admin/analytics',{headers:{Authorization:'Bearer '+document.getElementById('token').value}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');out.innerHTML='<div class="card"><h2>Totals</h2><p>Users: '+d.totals.users+' · Events: '+d.totals.events+'</p></div><div class="card"><h2>Recent activity</h2><table><thead><tr><th>Time</th><th>User</th><th>Event</th><th>Data</th></tr></thead><tbody>'+d.recent.map(x=>'<tr><td>'+x.created_at+'</td><td>'+x.anonymous_id+'</td><td>'+x.event+'</td><td><pre>'+JSON.stringify(JSON.parse(x.payload||'{}'),null,2)+'</pre></td></tr>').join('')+'</tbody></table></div>'}catch(e){out.innerHTML='<div class="card">'+e.message+'</div>'}};</script></body></html>
