<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">How to use VANES AI</title><desc id="desc">Four-step visual guide: enter name, choose a subject, ask VANES, review and practise</desc><rect width="1200" height="720" rx="36" fill="#0b0f19"/><text x="60" y="78" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">How to use VANES AI</text><text x="60" y="115" font-family="Arial,sans-serif" font-size="20" fill="#aeb7c5">Verseversatile Adaptive Neuro Emergent System · your study companion</text><g font-family="Arial,sans-serif"><g transform="translate(60 165)"><rect width="250" height="440" rx="24" fill="#151c2a" stroke="#35e6ff"/><circle cx="125" cy="70" r="40" fill="#8f7cff"/><text x="125" y="83" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">1</text><text x="28" y="150" font-size="24" font-weight="700" fill="#fff">Start with your name</text><text x="28" y="190" font-size="17" fill="#c1c8d3">Enter your learner name</text><text x="28" y="218" font-size="17" fill="#c1c8d3">when VANES opens.</text><text x="28" y="270" font-size="17" fill="#c1c8d3">Your profile personalises</text><text x="28" y="298" font-size="17" fill="#c1c8d3">the dashboard on this</text><text x="28" y="326" font-size="17" fill="#c1c8d3">device.</text></g><g transform="translate(335 165)"><rect width="250" height="440" rx="24" fill="#151c2a" stroke="#35e6ff"/><circle cx="125" cy="70" r="40" fill="#8f7cff"/><text x="125" y="83" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">2</text><text x="28" y="150" font-size="24" font-weight="700" fill="#fff">Choose or ask</text><text x="28" y="190" font-size="17" fill="#c1c8d3">Browse O-Level and</text><text x="28" y="218" font-size="17" fill="#c1c8d3">A-Level subjects, or</text><text x="28" y="246" font-size="17" fill="#c1c8d3">ask a question directly.</text><text x="28" y="298" font-size="17" fill="#c1c8d3">VANES detects likely</text><text x="28" y="326" font-size="17" fill="#c1c8d3">subject and level.</text></g><g transform="translate(610 165)"><rect width="250" height="440" rx="24" fill="#151c2a" stroke="#35e6ff"/><circle cx="125" cy="70" r="40" fill="#8f7cff"/><text x="125" y="83" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">3</text><text x="28" y="150" font-size="24" font-weight="700" fill="#fff">Use AI modes</text><text x="28" y="190" font-size="17" fill="#c1c8d3">Try #explain, #practice,</text><text x="28" y="218" font-size="17" fill="#c1c8d3">#analyze, #plan, #mark,</text><text x="28" y="246" font-size="17" fill="#c1c8d3">or #summarize.</text><text x="28" y="298" font-size="17" fill="#c1c8d3">Upload a question photo</text><text x="28" y="326" font-size="17" fill="#c1c8d3">when needed.</text></g><g transform="translate(885 165)"><rect width="250" height="440" rx="24" fill="#151c2a" stroke="#35e6ff"/><circle cx="125" cy="70" r="40" fill="#8f7cff"/><text x="125" y="83" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">4</text><text x="28" y="150" font-size="24" font-weight="700" fill="#fff">Learn and improve</text><text x="28" y="190" font-size="17" fill="#c1c8d3">Save notes, practise,</text><text x="28" y="218" font-size="17" fill="#c1c8d3">and use the planner.</text><text x="28" y="270" font-size="17" fill="#c1c8d3">Switch light/dark mode</text><text x="28" y="298" font-size="17" fill="#c1c8d3">for comfortable study</text><text x="28" y="326" font-size="17" fill="#c1c8d3">on any screen.</text></g></g></svg>